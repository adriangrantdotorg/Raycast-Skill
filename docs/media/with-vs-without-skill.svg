<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img">
<title>The same request with and without the skill</title>
<desc>Without the skill: the AI guesses 212 lines, builds, fails on try 1, fails on tries 2 and 3, and works on try 4. With the skill: it checks the rules, selects a 9-line Script Command, works on try 1, and the rest of the lane is time you get back.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:14px;font-weight:600}.s{font-size:12px}
.lane{fill:#1f2328}.muted{fill:#59636e}.line{stroke:#59636e}.head{stroke:#59636e}
.gray rect{fill:#F1EFE8;stroke:#888780}.gray text{fill:#444441}
.red rect{fill:#FCEBEB;stroke:#E24B4A}.red text{fill:#791F1F}
.amber rect{fill:#FAEEDA;stroke:#BA7517}.amber text{fill:#633806}
.green rect{fill:#EAF3DE;stroke:#639922}.green text{fill:#27500A}

.lane{fill:#e6edf3}.muted{fill:#9198a1}.line{stroke:#9198a1}.head{stroke:#9198a1}
.gray rect{fill:#2C2C2A}.gray text{fill:#D3D1C7}
.red rect{fill:#501313}.red text{fill:#F7C1C1}
.amber rect{fill:#412402;stroke:#EF9F27}.amber text{fill:#FAC775}
.green rect{fill:#173404;stroke:#97C459}.green text{fill:#C0DD97}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#161b22" stroke="#30363d"/>

<g class="gray"><rect x="40" y="40" width="106" height="226" rx="6"/>
<text class="h" x="93" y="124" text-anchor="middle">Your request</text>
<text class="s" x="93" y="148" text-anchor="middle">"Make a hotkey</text>
<text class="s" x="93" y="166" text-anchor="middle">that restarts</text>
<text class="s" x="93" y="184" text-anchor="middle">my dev server"</text></g>

<text class="h lane" x="166" y="58">Without this skill</text>
<text class="h lane" x="166" y="198">With this skill</text>
<path class="line" d="M146 98 L164 98" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
<path class="line" d="M146 238 L164 238" fill="none" stroke-width="1.5" marker-end="url(#a)"/>

<g class="red"><rect x="166" y="70" width="94" height="56" rx="6"/><text class="h" x="213" y="93" text-anchor="middle">Guesses</text><text class="s" x="213" y="113" text-anchor="middle">212 lines</text></g>
<g class="red"><rect x="281" y="70" width="94" height="56" rx="6"/><text class="h" x="328" y="93" text-anchor="middle">Builds</text><text class="s" x="328" y="113" text-anchor="middle">npm + build</text></g>
<g class="red"><rect x="396" y="70" width="94" height="56" rx="6"/><text class="h" x="443" y="93" text-anchor="middle">Fails</text><text class="s" x="443" y="113" text-anchor="middle">try 1</text></g>
<g class="red"><rect x="511" y="70" width="94" height="56" rx="6"/><text class="h" x="558" y="93" text-anchor="middle">Fails</text><text class="s" x="558" y="113" text-anchor="middle">tries 2, 3</text></g>
<g class="amber"><rect x="626" y="70" width="94" height="56" rx="6"/><text class="h" x="673" y="93" text-anchor="middle">Works</text><text class="s" x="673" y="113" text-anchor="middle">try 4</text></g>
<path class="line" d="M260 98 L279 98" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
<path class="line" d="M375 98 L394 98" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
<path class="line" d="M490 98 L509 98" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
<path class="line" d="M605 98 L624 98" fill="none" stroke-width="1.5" marker-end="url(#a)"/>

<g class="green"><rect x="166" y="210" width="96" height="56" rx="6"/><text class="h" x="214" y="233" text-anchor="middle">Checks</text><text class="s" x="214" y="253" text-anchor="middle">the rules</text></g>
<g class="green"><rect x="276" y="210" width="110" height="56" rx="6"/><text class="h" x="331" y="233" text-anchor="middle">Select Script</text><text class="s" x="331" y="253" text-anchor="middle">9 lines</text></g>
<g class="green"><rect x="400" y="210" width="80" height="56" rx="6"/><text class="h" x="440" y="233" text-anchor="middle">Works</text><text class="s" x="440" y="253" text-anchor="middle">try 1</text></g>
<path class="line" d="M262 238 L274 238" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
<path class="line" d="M386 238 L398 238" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
<g class="gray"><rect x="494" y="210" width="226" height="56" rx="6" stroke-dasharray="5 4"/><text class="h" x="607" y="233" text-anchor="middle">Time you get back</text><text class="s" x="607" y="253" text-anchor="middle">no build, no retries</text></g>

<path class="line" d="M166 292 L718 292" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s muted" x="166" y="312">time</text>
</svg>
